name: Tailscale SSH Debug Session

on:
  workflow_dispatch:

jobs:
  ssh-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 1. 连接 Tailscale 网络并开启 Tailscale SSH
      # ---------------------------------------------------------
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          # oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          # oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          # 如果使用的是 Auth Key，可以用下面这行代替 oauth-* 配置：
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci
          args: --ssh # 关键：开启 Tailscale 内置的 SSH 服务

      # ---------------------------------------------------------
      # 2. 暂停 Runner，等待你连入调试
      # ---------------------------------------------------------
      - name: Keep Runner Alive for SSH
        run: |
          echo "======================================================="
          echo "Tailscale 已连接！Runner 设备名: github-runner"
          echo "你可以通过以下命令在本地终端直接连入："
          echo "  tailscale ssh runner@github-runner"
          echo "  或者：ssh runner@<Runner-Tailscale-IP>"
          echo "调试完成后，在 SSH 终端执行 'touch /tmp/continue' 即可退出"
          echo "======================================================="

          # 循环等待，直到创建 /tmp/continue 文件或超时 (设置 2 小时)
          timeout 7200 bash -c 'until [ -f /tmp/continue ]; do sleep 5; done' || true

      # ---------------------------------------------------------
      # 3. 调试结束后，上传生成的 APK 文件
      # ---------------------------------------------------------
      - name: Upload APKs to Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-apks
          path: '**/*.apk'
          if-no-files-found: warn
